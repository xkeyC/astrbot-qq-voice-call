name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx ruff check .
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: node --check bridge/napcat-plugin/index.mjs
      - run: node --check bridge/av-host/host.cjs
      - run: node --test bridge/tests/*.test.mjs
      - run: bash -n bridge/scripts/*.sh
